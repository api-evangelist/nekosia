x-evidence:
  round: '2026-08-19'
  admitted_from: Add-API gate auto-publish 2026-08-19 02:46 UTC, confidence 90.
  renamed: nekosia-api -> nekosia, domain-derived slug (nekosia.cat). Renamed BEFORE enrichment so artifacts
    were written with the correct names. Never published under the old slug.
  the_split_surface:
    finding: The API host is wide open. The website host blocks machines outright.
    api.nekosia.cat: 'root 200, invented path 404 — discriminates. Keyless: a live unauthenticated GET
      /api/v1/images/catgirl returned 200 with a full payload on 2026-08-19.'
    nekosia.cat: 'CORRECTED 2026-08-19, same day. First recorded as "403 on EVERY path ... a WAF block,
      not a JS challenge". That was wrong. The block is USER-AGENT BASED: a default curl/SDK/agent UA
      gets 403 with a 4,572b Cloudflare "Attention Required" page, but the SAME URL with an ordinary Chrome
      UA returns 200 — the documentation page is 24,154b of real HTML. Not a WAF challenge, not unreachable:
      a UA filter that any browser passes and most non-browser clients fail.'
    consequence: The eight nekosia.cat/documentation?page=... pointers are kept and ARE reachable — but
      only to a client that sends a browser user-agent. An agent, SDK or crawler using its own UA gets
      403. That is an agent-readiness problem rather than a dead-pointer problem, and it is cheap for
      the provider to fix.
    verified_reachable: status.nekosia.cat 200, discord.gg invite 200, github.com/Nekosia-API 200.
  documentation_is_readable_after_all: The docs are NOT machine-unreachable, they are just not readable
    at nekosia.cat. The source of truth is a public GitHub repo — Nekosia-API/documentation, pushed 2026-08-03
    — and raw.githubusercontent.com/Nekosia-API/documentation/main/endpoints.md returns 200 text/plain
    9,421b. Wired as X-Documentation-Source so the machine-readable path is recorded alongside the blocked
    canonical one.
  no_openapi: No OpenAPI, on either host or in the GitHub org. The pipeline deliberately did NOT derive
    one — there is no openapi/ directory in this repo. The data-model artifact reconstructs the response
    shape from the provider's own published schema and states in its own derivation_note that every field
    was observed on the wire. That is ours, labelled as ours, and not recorded as a contract they publish.
  also_ships: An official JavaScript SDK, Nekosia-API/nekosia.js, pushed 2026-08-06.
  no_llms_txt: 'Established only after the UA correction: with a browser UA, /llms.txt returns an honest
    404 (5,806b). The earlier 403 masked the absence. Nekosia publishes no llms.txt.'
  correction_note: Recorded rather than silently amended. The original claim went out in commit ecf25d2
    and was wrong about the mechanism; a browser-UA retry while profiling sniffcat, which showed the same
    behaviour, is what surfaced it.

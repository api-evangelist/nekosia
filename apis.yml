aid: nekosia
name: Nekosia API
description: Nekosia is a free, keyless anime-image REST API serving cute anime "neko" (catgirl) imagery
  and related metadata, backed by the provider's own Booru. Three documented GET operations return JSON
  carrying dominant colours, original and compressed image variants, dimensions, tags, content ratings,
  anime and character names, the original source and full artist attribution. No API key, no registration
  and no account are required; rate limits are enforced per IP address and reported through standards-track
  RateLimit response headers. Standard public use is free, but commercial use requires prior written consent
  from the operator.

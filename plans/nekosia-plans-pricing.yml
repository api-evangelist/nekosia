summary: >-
  Nekosia publishes NO plans, NO tiers and NO prices, and this is a deliberate product position
  rather than a gap. The API is free, requires no registration and issues no API key, so there is
  nothing to price and no account to attach a plan to. There is no pricing page anywhere on the
  site and none is linked from the navigation. What exists instead of pricing is a licensing gate:
  standard public use is free, and COMMERCIAL use is prohibited without prior written consent from
  the administrator, obtained by contacting them directly.

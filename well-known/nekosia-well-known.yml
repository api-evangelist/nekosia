summary: >-
  One real well-known document is served, and it is served consistently on ALL THREE Nekosia hosts:
  an RFC 9116 security.txt. It is a genuine WellKnown hit and a genuine SecurityTxt hit, so both
  pointers are earned. Nothing else is served anywhere: no api-catalog, no ai-plugin.json, no OIDC
  discovery, no OAuth authorization-server metadata, and no A2A agent card on any host.
pointer_basis: >-
  WellKnown + SecurityTxt pointers emitted on the strength of the 200 text/plain security.txt on
  nekosia.cat, api.nekosia.cat and cdn.nekosia.cat. No AgentCard pointer is emitted — every
  agent-card path 404s.
false_positive_watch: >-
  nekosia.cat is fronted by Cloudflare and returns HTTP 403 (a "Sorry, you have been blocked"
  interstitial) to a default curl user-agent on most HTML paths. All statuses recorded here were
  taken with a browser user-agent, which the site answers normally. A future round that records
  403s from a bare curl as "blocked by the provider" would be wrong — the origin serves these
  paths, the bot challenge is what refuses.

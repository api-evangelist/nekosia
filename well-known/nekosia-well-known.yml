security_txt:
  file: nekosia-security.txt
  rfc: '9116'
  url: https://nekosia.cat/.well-known/security.txt
  fields:
    canonical: https://nekosia.cat/.well-known/security.txt
    contact: mailto:support@nekosia.cat
    expires: '2030-12-10T12:00:00Z'
    policy: https://nekosia.cat/documentation?page=privacy-policy
    preferred_languages: [pl, en]
  conformance_note: >-
    Contact, Expires and Canonical are present, which satisfies RFC 9116's required fields. The
    Expires value is 2030-12-10, more than four years out — RFC 9116 recommends a value less than
    a year in the future, so the document is valid but long-lived. Policy points at the privacy
    policy rather than a dedicated vulnerability-disclosure page; there is no Encryption,
    Acknowledgments or Hiring field, and no PGP key.
agent_card:
  found: false
  note: >-
    Probed /.well-known/agent-card.json and the legacy /.well-known/agent.json on all three hosts;
    all seven paths returned 404. No a2a/ artifact is written and no AgentCard pointer is emitted.
robots:
  url: https://nekosia.cat/robots.txt
  status: 200
  disallow: ['/auth/', '/logout', '/acp', '/*/edit']
  sitemaps:
    - https://nekosia.cat/sitemap.xml
    - https://nekosia.cat/sitemap-images.xml
  note: >-
    Crawling of the documentation and API surface is explicitly permitted; only the auth, admin
    and edit paths are disallowed.
llms_txt:

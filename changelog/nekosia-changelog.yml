summary: >-
  Nekosia publishes a real, dated, human-written changelog covering four separately-versioned
  components, labelled inline: [WWW] the website/backend, [API] the REST API, [CDN] the image CDN
  and [CRON] the background jobs. Entries are newest-first and semantic-versioned. This is
  genuinely better than most providers this size ship, and it is machine-readable at the raw
  markdown URL above even though the rendered page sits behind a Cloudflare bot challenge.

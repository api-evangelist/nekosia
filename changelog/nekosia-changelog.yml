observations:
  api_change_cadence: >-
    The [API] component has shipped 8 recorded changes in two years, the most recent on 2026-04-02.
    The API surface is stable to the point of being static; almost all development activity is on
    the website and Booru, not the API.
  breaking_changes_without_a_major_bump: >-
    Two of the eight [API] entries (2024-11-06 and 2026-04-02) changed observable behaviour for
    existing clients while the path version stayed at v1. The provider documents semver carefully
    in its introduction, but has not applied the MAJOR rule to the API path. Treat `v1` as a
    moving target and read the changelog rather than trusting the version segment.
